# OctoDroid 商店后端：每天 0 点、12 点（北京时间，即 UTC 4 点、16 点）
# 预计算一次静态 JSON，推到 gh-pages 分支。
# App 取 https://3299074036.github.io/OctoDroid/store/ 下的现成文件，
# 不再走实时全量搜索。严格版（2026-11-08，用户定：全对上）：feed 池子
# = hiwiki 当次重抓的可安装池，我方独有的 1,408 条已删；榜单归属 =
# hiwiki subgroup（条目带 ranks 字段）；榜内排序由 App 按纯星标排；
# 搜索管线与 Komi 镜像整段已删。API 调用走仓库 secret STORE_PAT
# （细粒度 PAT，仅公开仓库只读；每小时 5000 次），每轮只补新入池仓库
# 的 forks/topics/created_at（首轮约 2457 次，稳态约 0–30 次）。
# GITHUB_TOKEN 只留给推 gh-pages 用（已有 contents: write 权限）。
# 历史快照：每轮把输出仓库的星标数写成 store/history/<日期>.json 推到
# gh-pages，下轮读 7 天前的快照算近 7 日均涨星（零新增 API 调用，
# 攒够 7 天后生成器热门条目切到真·近期日均）。
# 最新入库：harvest 每轮多抓 hiwiki /zh-CN/newest 页出
# hiwiki-newest.json，生成器拼成 store/feed/newest.json（60 条、入库
# 顺序）；该步失败永不拦整轮——生成器沿用上一轮的 newest.json
# （stale），两者都没有则本轮不写该文件，feed 不受影响。
# 快照（App 内置离线兜底）不由本工作流更新：只在出 App 包前本地跑
# 一次生成器、随代码提交，避免往主分支写提交。
name: store-backend

on:
  schedule:
    - cron: "0 4,16 * * *"
  workflow_dispatch:

concurrency:
  group: store-backend
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch history snapshots and previous outputs
        run: |
          set -e
          mkdir -p store-history prev-hiwiki
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/gh-pages-history gh-pages
            cp /tmp/gh-pages-history/store/history/*.json store-history/ 2>/dev/null || true
            cp /tmp/gh-pages-history/store/feed/all.json prev-feed.json 2>/dev/null || true
            cp /tmp/gh-pages-history/store/meta.json prev-meta.json 2>/dev/null || true
            cp /tmp/gh-pages-history/store/feed/newest.json prev-newest.json 2>/dev/null || true
            cp /tmp/gh-pages-history/store/hiwiki/hiwiki-pool.json prev-hiwiki/ 2>/dev/null || true
            cp /tmp/gh-pages-history/store/hiwiki/hiwiki-ranks.json prev-hiwiki/ 2>/dev/null || true
            cp /tmp/gh-pages-history/store/hiwiki/harvest-log.json prev-hiwiki/ 2>/dev/null || true
            git worktree remove --force /tmp/gh-pages-history
          fi
          ls prev-feed.json 2>/dev/null; ls prev-hiwiki/ 2>/dev/null; true
      - name: Harvest hiwiki
        id: harvest
        run: |
          set +e
          mkdir -p hiwiki-data
          python3 store-backend/harvest-hiwiki.py --out-dir hiwiki-data
          HARVEST_RC=$?
          set -e
          if [ "$HARVEST_RC" -eq 0 ]; then
            echo "harvestStatus=ok" >> "$GITHUB_OUTPUT"
            echo "harvest ok"
          else
            echo "harvest failed (rc=$HARVEST_RC), falling back"
            # 138：失败分支先删本轮可能已写的残 pool（harvest 在写完
            # pool 后才判失败率 >5% 返回 1；level-3 分支只补 ranks，
            # 不删 pool 会让残池被当回落池用）。level-2 随后会用上一
            # 轮 pool 覆盖它，level-3 则保持无 pool、生成器走上一轮
            # feed 回落，与回显文案一致。
            rm -f hiwiki-data/hiwiki-pool.json
            # 79：harvest 失败时删掉本轮可能已写的 newest（失败率 >5% 时
            # harvest-hiwiki 仍可能已落盘不完整 newest），生成器改走
            # stale 路径（上一轮 prev-newest.json），避免 meta 里
            # harvestStatus=fallback 与 newestStatus=ok 自相矛盾。
            rm -f hiwiki-data/hiwiki-newest.json
            if [ -f prev-hiwiki/hiwiki-pool.json ] && [ -f prev-hiwiki/hiwiki-ranks.json ]; then
              cp prev-hiwiki/hiwiki-pool.json prev-hiwiki/hiwiki-ranks.json hiwiki-data/
              echo "fallback: previous round artifacts (level 2)"
            else
              cp store-backend/hiwiki-ranks.json hiwiki-data/hiwiki-ranks.json
              echo "fallback: committed hiwiki-ranks.json (level 3, no pool file; Generate reuses previous feed hiwiki items)"
            fi
            python3 -c "import json; json.dump({'harvestStatus': 'fallback', 'reason': 'harvest rc=$HARVEST_RC'}, open('hiwiki-data/harvest-log.json', 'w'), ensure_ascii=False)"
            echo "harvestStatus=fallback" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate store JSON
        env:
          STORE_PAT: ${{ secrets.STORE_PAT }}
          HARVEST_STATUS: ${{ steps.harvest.outputs.harvestStatus }}
        run: |
          set -e
          if [ -z "$STORE_PAT" ]; then echo "STORE_PAT secret is missing or empty"; exit 1; fi
          python3 store-backend/generate.py \
            --hiwiki-pool hiwiki-data/hiwiki-pool.json \
            --hiwiki-ranks hiwiki-data/hiwiki-ranks.json \
            --hiwiki-newest hiwiki-data/hiwiki-newest.json \
            --prev-feed prev-feed.json \
            --prev-meta prev-meta.json \
            --prev-newest prev-newest.json \
            --metadata-cap 4500 \
            --harvest-status "$HARVEST_STATUS" \
            --history-dir store-history \
            --out store-output --snapshot-dir /dev/null
      - name: Verify output
        run: |
          python3 - <<'PYEOF'
          import json

          meta = json.load(open("store-output/meta.json"))
          feed = json.load(open("store-output/feed/all.json"))["items"]
          mapping = json.load(open("hiwiki-data/hiwiki-ranks.json"))

          # Effective pool for this run: fresh/previous harvest pool if
          # present (levels 1-2), else previous feed hiwiki items (level 3).
          pool_records = None
          try:
              pool_records = json.load(open("hiwiki-data/hiwiki-pool.json"))["records"]
          except Exception:
              pool_records = None
          if pool_records is None:
              prev = json.load(open("prev-feed.json"))["items"]
              pool_names = {i["fullName"].lower() for i in prev
                            if i.get("source") == "hiwiki"}
          else:
              pool_names = {r["fullName"].lower() for r in pool_records}
          feed_names = {i["fullName"].lower() for i in feed}
          # 86：feed 本身不应有重复 fullName（生成器已按 fullName 去重）。
          assert len(feed_names) == len(feed), "feed has duplicate fullName"
          dropped_names = pool_names - feed_names
          expected_ranked = (
              sum(1 for n in pool_names if n in mapping)
              - sum(1 for n in pool_names if n in mapping and n not in feed_names))
          expected_unranked = len(feed) - expected_ranked
          ranked = sum(1 for i in feed if i.get("ranks"))
          unranked = len(feed) - ranked
          nonempty = len({r for i in feed for r in (i.get("ranks") or [])})

          assert meta["poolSize"] > 0, meta
          assert len(feed) + meta.get("droppedNoInstallable", 0) == meta["poolSize"], meta
          assert ranked + unranked == len(feed), meta
          assert ranked == expected_ranked, (ranked, expected_ranked, meta)
          assert unranked == expected_unranked, (unranked, expected_unranked, meta)
          assert all(isinstance(i.get("ranks"), list) for i in feed), "ranks field missing"
          assert all(i.get("source") == "hiwiki" for i in feed), "non-hiwiki source in feed"
          assert all(r in set(mapping.values()) for i in feed for r in (i.get("ranks") or [])), "rank outside mapping"
          assert meta.get("apiCalls", 0) <= 5000, meta

          # 最新入库：新鲜 harvest 有文件时必须与 harvest 逐条对上
          # （条数、顺序、必填字段）；只有上一轮时沿用上一轮的条目
          # 顺序；两者都没有时 meta 记 missing 且不写文件——三种情况
          # 都不拦整轮，feed 计数上面已核过。
          import os
          newest_status = meta.get("newestStatus")
          newest_path = "store-output/feed/newest.json"
          if newest_status == "ok":
              harvest_newest = json.load(
                  open("hiwiki-data/hiwiki-newest.json"))["items"]
              newest = json.load(open(newest_path))["items"]
              # 86：newest 须与 harvest 逐条对上（去重后比对：生成器按
              # fullName 去重保序，harvest 若有重复行则 newest 更短）；
              # 且 newest 自身无重复 fullName。
              harvest_names = [i["fullName"].lower()
                               for i in harvest_newest]
              deduped = list(dict.fromkeys(harvest_names))
              newest_names = [i["fullName"].lower() for i in newest]
              assert newest_names == deduped, "newest order/dedupe mismatch"
              assert len(set(newest_names)) == len(newest_names), (
                  "newest has duplicate fullName")
              assert all(set(("fullName", "description", "category",
                              "language", "stars", "latestTag",
                              "lastReleaseTime", "platforms")) <= set(i)
                         for i in newest), "newest item missing field"
              print("newest ok: %d items" % len(newest))
          elif newest_status == "stale":
              prev_newest = json.load(open("prev-newest.json"))["items"]
              newest = json.load(open(newest_path))["items"]
              assert [i["fullName"] for i in newest] == [
                  i["fullName"] for i in prev_newest], "stale newest mismatch"
              # 86：stale 分支同样断言无重复 fullName。
              assert len({i["fullName"].lower() for i in newest}) == len(newest), (
                  "stale newest has duplicate fullName")
              print("newest stale: %d items (previous round)" % len(newest))
          else:
              assert newest_status == "missing", meta
              assert not os.path.exists(newest_path), (
                  "newest.json should be absent when missing")
              print("newest missing: no file this round (feed unaffected)")

          print("ok poolSize=%s feed=%s ranked=%s unranked=%s nonemptyRanks=%s harvestStatus=%s apiCalls=%s droppedNoInstallable=%s metadataDegraded=%s newest=%s/%s"
                % (meta["poolSize"], len(feed), ranked, unranked, nonempty,
                   meta.get("harvestStatus"), meta.get("apiCalls"),
                   meta.get("droppedNoInstallable"), meta.get("metadataDegraded"),
                   meta.get("newestStatus"), meta.get("newestCount")))
          PYEOF
      - name: Publish to gh-pages
        run: |
          set -e
          git config user.name "octodroid-store-bot"
          git config user.email "octodroid-store-bot@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/gh-pages gh-pages
          else
            git worktree add /tmp/gh-pages -b gh-pages
          fi
          mkdir -p /tmp/gh-pages/store
          # 140：用 rsync --delete 同步 store-output/，删掉 gh-pages
          # 里多余的旧文件（某轮 newest 缺失时旧 newest.json、feed
          # 缩水后多余的 page<N>.json 不再以旧版继续当新鲜数据服务）。
          # history/ 与 hiwiki/ 不在 store-output 里、由下面步骤单独
          # 管理，用 --exclude 保护，不参与 --delete。
          rsync -a --delete --exclude='/history/' --exclude='/hiwiki/' \
            store-output/ /tmp/gh-pages/store/
          # 140：发布后断言 gh-pages 副本无多余文件（newest 有无与
          # meta newestStatus 一致，各平台分页数与 feedPages 一致）。
          python3 - <<'PYEOF'
          import json, os
          meta = json.load(open("store-output/meta.json"))
          store = "/tmp/gh-pages/store"
          newest = os.path.join(store, "feed", "newest.json")
          if meta.get("newestStatus") == "missing":
              assert not os.path.exists(newest), "stale newest.json left in gh-pages copy"
          else:
              assert os.path.exists(newest), "newest.json missing from gh-pages copy"
          for platform, pages in meta.get("feedPages", {}).items():
              d = os.path.join(store, "feed", platform)
              got = sorted(f for f in os.listdir(d)
                           if f.startswith("page") and f.endswith(".json"))
              assert len(got) == pages, (platform, got, pages)
          print("publish check ok: newest=%s pages match feedPages"
                % meta.get("newestStatus"))
          PYEOF
          mkdir -p /tmp/gh-pages/store/history
          cp store-history/*.json /tmp/gh-pages/store/history/ 2>/dev/null || true
          # 141：历史快照只留 30 天滚动。按文件名日期清理（<YYYY-MM-DD>.json），
          # 不用 mtime：/tmp/gh-pages 是每轮新鲜 worktree 检出，所有文件
          # mtime 均为检出时刻，-mtime +30 恒为假、清理永不生效。
          python3 - <<'PYEOF'
          import datetime, os
          hist = "/tmp/gh-pages/store/history"
          today = datetime.date.today()
          removed = 0
          for name in os.listdir(hist):
              if not (name.endswith(".json") and len(name) == 15):
                  continue
              try:
                  day = datetime.date.fromisoformat(name[:-5])
              except ValueError:
                  continue
              if (today - day).days > 30:
                  os.remove(os.path.join(hist, name))
                  removed += 1
          print("history cleanup: removed %d files older than 30 days" % removed)
          PYEOF
          mkdir -p /tmp/gh-pages/store/hiwiki
          cp hiwiki-data/*.json /tmp/gh-pages/store/hiwiki/ 2>/dev/null || true
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git add store .nojekyll
          if git diff --cached --quiet; then
            echo "no changes, skip push"
          else
            git commit -m "store data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin gh-pages
          fi
